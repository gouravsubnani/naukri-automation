name: Naukri Daily Automation

on:
  # Runs daily at ~9:00 AM IST (3:30 AM UTC)
  # Set 15 min early to account for GitHub Actions queue delays
  schedule:
    - cron: "15 3 * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  naukri-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Create .env file
        run: |
          echo "RESUME_PATH=${{ github.workspace }}/resume/Gourav_Resume_DataEngineer.pdf" >> .env

      - name: Run Naukri automation
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: python scheduler.py --now

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-log-${{ github.run_number }}
          path: naukri_automation.log
          retention-days: 7

      - name: Upload screenshots for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7
